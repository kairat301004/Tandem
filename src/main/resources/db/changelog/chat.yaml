databaseChangeLog:
  - changeSet:
      id: chat-table
      author: Kairat
      changes:
        - createTable:
            tableName: chat
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: name
                  type: varchar
                  constraints:
                    nullable: false

              - column:
                  name: type
                  type: varchar(255)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: timestamp
                  constraints:
                    nullable: false
