databaseChangeLog:
  - changeSet:
      id: user-table
      author: Kairat
      changes:
        - createTable:
            tableName: user
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: email
                  type: varchar
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: password_hash
                  type: text
                  constraints:
                    nullable: false

              - column:
                  name: first_name
                  type: varchar
                  constraints:
                    nullable: false

              - column:
                  name: last_name
                  type: varchar
                  constraints:
                    nullable: false

              - column:
                  name: position
                  type: varchar
                  constraints:
                    nullable: false

              - column:
                  name: phone
                  type: varchar

              - column:
                  name: avatar_url
                  type: text
                  constraints:
                    nullable: true
              - column:
                  name: department_id
                  type: uuid
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: varchar
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: timestamp
                  constraints:
                    nullable: false


